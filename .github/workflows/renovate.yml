name: Renovate
on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches:
      - main
    paths:
      - .github/renovate.json5
      - .github/renovate-global.js
  workflow_dispatch: {}
concurrency:
  group: renovate
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.33.0/install
          github_access_token: ${{ steps.app-token.outputs.token }}
      - name: Run Renovate
        run: nix shell --inputs-from . nixpkgs#renovate nixpkgs#nix-update --command renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_CONFIG_FILE: .github/renovate-global.js
          LOG_LEVEL: ${{ vars.RENOVATE_LOG_LEVEL || 'info' }}
